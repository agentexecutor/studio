# Pushing a vX.Y.Z[-PRERELEASE] tag builds ax-studio for Linux and macOS
# (amd64 and arm64) and publishes the archives, with checksums.txt, to a GitHub
# release for the tag. The binary reports the tag as its version. A tag with a
# "-" (v0.1.0-rc.1) is published as a prerelease. The tag must point at a
# commit on main or a release-* branch; the workflow refuses any other commit.
#
# A manual run builds the archives and keeps them as workflow artifacts,
# without publishing anything.
#
# See "Release" in README.md.
name: Release

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+*']
  workflow_dispatch:

permissions:
  contents: read

# A tag push and a re-run for the same tag never publish at the same time.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # The tag filter above cannot express the whole format.
      - name: Check the tag
        if: github.ref_type == 'tag'
        run: |
          if ! [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "error: '$GITHUB_REF_NAME' is not vX.Y.Z or vX.Y.Z-PRERELEASE" >&2
            exit 1
          fi

      # The build needs no token:
      # none is left in the git config, and only the last step is given one.
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          # The check below needs main, the release-* branches and their history.
          fetch-depth: 0
          persist-credentials: false

      # Releases are cut from main or a release-* branch, so a tag on an
      # unreviewed branch cannot publish.
      - name: Check the tag is on main or a release branch
        if: github.ref_type == 'tag'
        run: |
          for b in origin/main $(git for-each-ref --format='%(refname:short)' 'refs/remotes/origin/release-*'); do
            if git merge-base --is-ancestor HEAD "$b"; then
              echo "$GITHUB_REF_NAME is on $b"
              exit 0
            fi
          done
          echo "error: $GITHUB_REF_NAME ($(git rev-parse --short HEAD)) is not on origin/main or an origin/release-* branch" >&2
          exit 1

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"

      - name: Set up Go
        uses: actions/setup-go@f111f3307d8850f501ac008e886eec1fd1932a34 # v5.3.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Test
        run: make verify

      - name: Build the release archives
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            version="$GITHUB_REF_NAME"
          else
            version="${GITHUB_SHA::8}"
          fi
          make dist VERSION="$version"
          ls -lh dist/
          cat dist/checksums.txt

          # The archive for this runner holds a binary that reports the version.
          (cd dist && sha256sum --check checksums.txt)
          tar -xzf dist/ax-studio_linux_amd64.tar.gz -C "$RUNNER_TEMP"
          got="$("$RUNNER_TEMP/ax-studio" --version)"
          if [ "$got" != "ax-studio $version" ]; then
            echo "error: the binary reports '$got', not 'ax-studio $version'" >&2
            exit 1
          fi

      - name: Keep the archives as workflow artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ax-studio-archives
          path: |
            dist/ax-studio_*.tar.gz
            dist/checksums.txt
          if-no-files-found: error

      # A release is never changed once it exists: this fails if the tag
      # already has one, so the files under a tag stay the same.
      - name: Publish the release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          files=(dist/ax-studio_*.tar.gz dist/checksums.txt)
          flags=(--title "AX Studio $TAG" --generate-notes --verify-tag)
          case "$TAG" in
            *-*) flags+=(--prerelease) ;;
          esac
          gh release create "$TAG" "${files[@]}" "${flags[@]}"
