<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AX Studio: run coding agents safely, anywhere</title>
  <meta name="description" content="AX Studio lets you run, watch, and steer coding agents in a secure sandbox on your computer, then move them to a remote cluster with the same guardrails.">
  <meta name="color-scheme" content="light dark">
  <link rel="icon" type="image/svg+xml" href="assets/logo.svg?v=3">
  <!-- Runs before the first paint: the demo reset links and the theme. -->
  <script src="boot.js"></script>
  <link rel="stylesheet" href="vendor/xterm/xterm.css">
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="views.css">
  <link rel="stylesheet" href="mascot.css">
  <link rel="stylesheet" href="polish.css">
</head>
<body>
  <button type="button" class="skip-link" data-action="skip-to-main">Skip to main content</button>
  <div id="root"></div>
  <div class="toasts" id="toasts" role="status" aria-live="polite" aria-atomic="false"></div>
  <div id="announcer" class="sr-only" aria-live="polite"></div>
  <div id="overlay"></div>
  <script src="core.js"></script>
  <script src="mascot.js"></script>
  <script src="viz.js"></script>
  <script src="failures.js"></script>
  <script src="views.js"></script>
  <script src="task.js"></script>
  <script src="overlays.js"></script>
  <!-- env.js says whether the Studio server is behind this page. api.js talks to it, and the live files show what it returns. -->
  <script src="env.js"></script>
  <script src="api.js"></script>
  <!-- xterm.js draws the Terminal tab's shells (vendor/xterm/README.md). -->
  <script src="vendor/xterm/xterm.js"></script>
  <script src="vendor/xterm/addon-fit.js"></script>
  <script src="live.js"></script>
  <script src="live-env.js"></script>
  <script src="live-new.js"></script>
  <script src="live-logs.js"></script>
  <script src="live-resources.js"></script>
  <script src="live-nav.js"></script>
  <script src="live-settings.js"></script>
  <script src="app.js"></script>
</body>
</html>
